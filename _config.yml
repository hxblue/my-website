# Hexo 站点配置
# 文档：https://hexo.io/docs/configuration

# Site
title: Chblue
subtitle: 'Java 后端 · AI 应用'
description: 'Chblue 的个人作品集与技术博客，记录 Java 后端开发、AI 应用和工程实践。'
keywords: [Chblue, 全栈, Java 后端, AI 应用, 博客, 知识库]
author: Chblue
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://my-website-two-mauve-11.vercel.app
# 旧站文章地址是 /blog/<slug>，沿用 slug，保证旧链接继续有效
permalink: blog/:slug/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# 首页（作品集）是 source/index.md，文章列表放在 /blog/
index_generator:
  path: 'blog'
  per_page: 10
  order_by: -date

default_category: 笔记
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Markdown
marked:
  gfm: true
  breaks: false
  prependRoot: true
  postAsset: false

# 本地搜索索引（Butterfly local_search 使用）
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: false
  order_by: -date

# 站点地图
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Deployment（由 Vercel 构建，不用 hexo deploy）
deploy:
